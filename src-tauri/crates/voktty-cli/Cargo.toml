[package]
name = "voktty-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "voktty-cli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
dirs = "6"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
voktty-aliases = { path = "../voktty-aliases" }
voktty-control-protocol = { path = "../voktty-control-protocol" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
