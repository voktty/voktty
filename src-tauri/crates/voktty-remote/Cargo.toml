[package]
name = "voktty-remote"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "voktty-remote"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
dirs = "7"
globset = "0.4"
grep-matcher = "0.1"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
notify = "8.2.0"
nucleo-matcher = "0.3"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
voktty-agent-feed = { path = "../voktty-agent-feed" }
voktty-memory-local = { path = "../voktty-memory-local" }
voktty-remote-protocol = { path = "../voktty-remote-protocol" }
voktty-workspace-edit = { path = "../voktty-workspace-edit" }
voktty-workspace-kit = { path = "../voktty-workspace-kit" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
