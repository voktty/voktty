<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/voktty.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voktty — Settings</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("voktty-ui-theme-shadow");
          var resolved =
            t === "light" || t === "dark"
              ? t
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.classList.add(resolved);
          document.documentElement.style.backgroundColor =
            resolved === "dark" ? "#141414" : "#ffffff";

          var lang = localStorage.getItem("voktty-ui-language-shadow") || "en";
          var dir = lang === "ar" ? "rtl" : "ltr";
          document.documentElement.lang = lang;
          document.documentElement.dir = dir;
          document.documentElement.setAttribute("data-direction", dir);
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="settings-root"></div>
    <script type="module" src="/src/settings/main.tsx"></script>
  </body>
</html>
