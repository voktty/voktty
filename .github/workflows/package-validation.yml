name: Package validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-remote-helper:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: package-validation-remote-helper-linux-x86_64

      - name: Build remote helper
        working-directory: src-tauri
        run: cargo build --locked -p voktty-remote --release --target x86_64-unknown-linux-musl

      - name: Stage remote helper
        run: |
          mkdir -p src-tauri/resources/remote/linux-x86_64
          cp src-tauri/target/x86_64-unknown-linux-musl/release/voktty-remote \
            src-tauri/resources/remote/linux-x86_64/voktty-remote
          test -s src-tauri/resources/remote/linux-x86_64/voktty-remote

      - name: Upload remote helper
        uses: actions/upload-artifact@v7
        with:
          name: package-validation-remote-linux-x86_64
          path: src-tauri/resources/remote/linux-x86_64/
          if-no-files-found: error
          retention-days: 1

  build-packages:
    needs: build-remote-helper
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            label: macOS ARM64
            artifact-name: macos-arm64
            args: --target aarch64-apple-darwin
            rust-target: aarch64-apple-darwin
            bundle-root: src-tauri/target/aarch64-apple-darwin/release/bundle
            artifact-path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: macos-latest
            label: macOS Intel
            artifact-name: macos-x64
            args: --target x86_64-apple-darwin
            rust-target: x86_64-apple-darwin
            bundle-root: src-tauri/target/x86_64-apple-darwin/release/bundle
            artifact-path: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            label: Linux x64
            artifact-name: linux-x64
            args: ""
            rust-target: ""
            bundle-root: src-tauri/target/release/bundle
            artifact-path: |
              src-tauri/target/release/bundle/appimage/*.AppImage
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            label: Windows x64
            artifact-name: windows-x64
            args: ""
            rust-target: ""
            bundle-root: src-tauri/target/release/bundle
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi

    name: Build ${{ matrix.label }} packages
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: package-validation-${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download remote helper
        uses: actions/download-artifact@v8
        with:
          name: package-validation-remote-linux-x86_64
          path: src-tauri/resources/remote/linux-x86_64

      - name: Verify remote helper resource
        shell: bash
        run: test -s src-tauri/resources/remote/linux-x86_64/voktty-remote

      - name: Build unsigned Tauri packages
        env:
          VOKTTY_CLI_TARGET: ${{ matrix.rust-target }}
        run: pnpm tauri build --ci --no-sign --config src-tauri/tauri.package-validation.conf.json ${{ matrix.args }}

      - name: Verify macOS package
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        run: |
          shopt -s nullglob
          files=("${{ matrix.bundle-root }}"/dmg/*.dmg)
          (( ${#files[@]} > 0 )) || { echo "No macOS DMG was produced."; exit 1; }
          printf '%s\n' "${files[@]}"

      - name: Verify Linux packages
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          for pattern in appimage/*.AppImage deb/*.deb rpm/*.rpm; do
            compgen -G "${{ matrix.bundle-root }}/$pattern" >/dev/null \
              || { echo "Missing Linux package: $pattern"; exit 1; }
          done
          find "${{ matrix.bundle-root }}" -maxdepth 2 -type f -print

      - name: Verify Windows packages
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleRoot = "${{ matrix.bundle-root }}"
          $nsis = @(Get-ChildItem "$bundleRoot/nsis" -Filter *.exe -ErrorAction Stop)
          $msi = @(Get-ChildItem "$bundleRoot/msi" -Filter *.msi -ErrorAction Stop)
          if ($nsis.Count -eq 0) { throw "No NSIS installer was produced." }
          if ($msi.Count -eq 0) { throw "No MSI installer was produced." }
          $nsis.FullName
          $msi.FullName

      - name: Upload validation packages
        uses: actions/upload-artifact@v7
        with:
          name: voktty-${{ matrix.artifact-name }}-${{ github.sha }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
          retention-days: 3

  validation-complete:
    needs:
      - build-remote-helper
      - build-packages
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Confirm package matrix
        run: echo "All unsigned desktop packages were built and uploaded successfully."
