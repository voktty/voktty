name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA on main to release (leave blank for the latest commit on main; it publishes once that commit's CI passes)"
        required: false
        type: string
        default: ""
      version:
        description: "Release version (leave blank to auto-increment or use package.json version)"
        required: false
        type: string
        default: ""
      windows:
        description: "Windows x64 (NSIS and MSI)"
        type: boolean
        default: true
      linux:
        description: "Linux x64 (AppImage, DEB and RPM)"
        type: boolean
        default: true
      macos_arm64:
        description: "macOS Apple Silicon"
        type: boolean
        default: true
      macos_intel:
        description: "macOS Intel"
        type: boolean
        default: true
      android:
        description: "Android APK (arm64, x64)"
        type: boolean
        default: false
      make_latest:
        description: "Set as auto-updater latest"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && 'manual-release' || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  prepare-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    outputs:
      source: ${{ steps.plan.outputs.source }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
      release-id: ${{ steps.plan.outputs.release-id }}
      latest: ${{ steps.plan.outputs.latest }}
      android: ${{ steps.plan.outputs.android }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Validate source and create release draft
        id: plan
        uses: actions/github-script@v9
        env:
          RELEASE_INPUTS: ${{ toJSON(inputs) }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { releasePlan, ciGate, applyVersion } = await import(pathToFileURL(resolve('scripts/release/desktop-release.mjs')).href);
            const inputs = JSON.parse(process.env.RELEASE_INPUTS || '{}');
            let source = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            let ciUrl = '';
            if (context.eventName === 'workflow_dispatch') {
              // Packages build while CI runs; the publish job waits for this
              // commit's CI to pass, so the release is always the commit asked
              // for, never an older green one.
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', branch: 'main', event: 'push', per_page: 100 });
              const runs = data.workflow_runs || [];
              const requestedCommit = (inputs.commit_sha || '').trim();
              if (requestedCommit) {
                const match = runs.find(r => r.head_sha === requestedCommit || r.head_sha.startsWith(requestedCommit));
                if (!match) {
                  throw new Error(`Commit ${requestedCommit} has no CI run on main.`);
                }
                source = match.head_sha;
              }
              const gate = ciGate(runs, source);
              if (gate.state === 'failed') {
                throw new Error(`CI for ${source} ended as ${gate.conclusion}: ${gate.url}. Fix or rerun it, or release a newer commit.`);
              }
              ciUrl = gate.url;
              if (gate.state !== 'passed') {
                core.info(`CI for ${source} has not passed yet; packages build now and the release is published only after it passes.`);
              }
              require('node:child_process').execFileSync('git', ['checkout', source], { encoding: 'utf8' });
            }
            const sourceVersion = require('./package.json').version;
            const releases = await github.paginate(github.rest.repos.listReleases, { ...context.repo, per_page: 100 });
            const publishedTags = new Set(releases.filter(r => !r.draft).map(r => r.tag_name));
            if (!inputs.version) {
              let [major, minor, patch] = sourceVersion.split('.').map(Number);
              while (publishedTags.has(`v${major}.${minor}.${patch}`)) {
                patch++;
              }
              inputs.version = `${major}.${minor}.${patch}`;
            }
            const plan = releasePlan({ eventName: context.eventName, ref: context.ref, sourceVersion, inputs });
            applyVersion(process.cwd(), plan.version);
            const notFound = (error) => { if (error.status !== 404 && error.status !== 422) throw error; return null; };
            const existingTag = await github.rest.repos.getCommit({ ...context.repo, ref: `tags/${plan.tag}` }).catch(notFound);
            if (existingTag && existingTag.data.sha !== source) {
              if (context.eventName === 'workflow_dispatch') {
                await github.rest.git.updateRef({ ...context.repo, ref: `tags/${plan.tag}`, sha: source, force: true }).catch(() => null);
              } else {
                throw new Error('Release tag points to a different commit. Choose a new version.');
              }
            }
            const android = Boolean(inputs.android);
            const existing = releases.find((release) => release.tag_name === plan.tag);
            if (existing && !existing.draft) throw new Error('This release is already published. Choose a new version.');
            const body = `Source commit: ${source}\n${ciUrl ? `CI: ${ciUrl}\n` : ''}Desktop platforms: ${plan.matrix.include.map((target) => target.selection).join(', ')}${android ? '\nAndroid APKs: arm64, x64' : ''}\nAuto-update latest: ${plan.latest}\n\nSee the assets to download and install.`;
            let release = existing;
            if (existing) {
              if (existing.target_commitish !== source || existing.body !== body) {
                const updated = await github.rest.repos.updateRelease({ ...context.repo, release_id: existing.id, target_commitish: source, body });
                release = updated.data;
              }
            } else {
              release = (await github.rest.repos.createRelease({ ...context.repo, tag_name: plan.tag, target_commitish: source, name: `Voktty ${plan.tag}`, body, draft: true, prerelease: plan.prerelease })).data;
            }
            for (const [key, value] of Object.entries({ source, version: plan.version, tag: plan.tag, matrix: JSON.stringify(plan.matrix), 'release-id': release.id, latest: String(plan.latest), android: String(android) })) core.setOutput(key, value);
            await core.summary.addHeading(`Release ${plan.tag}`).addRaw(body).write();

  build-remote-helper:
    needs: prepare-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            target: x86_64-unknown-linux-musl
            runner: ubuntu-22.04
          - architecture: aarch64
            target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
      - name: Apply release version in build workspace
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node scripts/release/desktop-release.mjs "$RELEASE_VERSION"
        shell: bash

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools file

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: remote-helper-linux-${{ matrix.architecture }}

      - name: Build remote helper
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        working-directory: src-tauri
        run: cargo build --locked -p voktty-remote --release --target ${{ matrix.target }}

      - name: Stage remote helper
        run: |
          mkdir -p src-tauri/resources/remote/linux-${{ matrix.architecture }}
          cp src-tauri/target/${{ matrix.target }}/release/voktty-remote \
            src-tauri/resources/remote/linux-${{ matrix.architecture }}/voktty-remote
          test -s src-tauri/resources/remote/linux-${{ matrix.architecture }}/voktty-remote
          binary_info="$(file src-tauri/resources/remote/linux-${{ matrix.architecture }}/voktty-remote)"
          echo "$binary_info"
          echo "$binary_info" | grep -E "statically linked|static-pie linked"
          case "${{ matrix.architecture }}" in
            x86_64) echo "$binary_info" | grep -F "x86-64" ;;
            aarch64) echo "$binary_info" | grep -F "ARM aarch64" ;;
          esac

      - name: Upload remote helper
        uses: actions/upload-artifact@v7
        with:
          name: voktty-remote-linux-${{ matrix.architecture }}
          path: src-tauri/resources/remote/linux-${{ matrix.architecture }}/
          if-no-files-found: error
          retention-days: 1

  build-host-packages:
    needs: prepare-release
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Apply release version in build workspace
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node scripts/release/desktop-release.mjs "$RELEASE_VERSION"
      - run: pnpm install --frozen-lockfile
      - name: Build pinned host runtimes
        run: |
          pnpm build:host
          node host/package.mjs --all
      - name: Verify host package reproducibility
        run: |
          sha256sum build/host-packages/*.tar.gz build/host-packages/*.zip > "$RUNNER_TEMP/host-first.sha256"
          node host/package.mjs --all
          sha256sum build/host-packages/*.tar.gz build/host-packages/*.zip > "$RUNNER_TEMP/host-second.sha256"
          diff -u "$RUNNER_TEMP/host-first.sha256" "$RUNNER_TEMP/host-second.sha256"
      - name: Upload host packages
        uses: actions/upload-artifact@v7
        with:
          name: voktty-host-packages
          path: |
            build/host-packages/*.tar.gz
            build/host-packages/*.zip
            build/host-packages/*.sha256
          if-no-files-found: error
          retention-days: 1

  publish-tauri:
    needs: [prepare-release, build-remote-helper]
    permissions:
      contents: write
      id-token: write
    env:
      SIGNPATH_ENABLED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
      APPLE_SIGNING_ENABLED: ${{ secrets.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_CERTIFICATE != '' }}
      APPLE_API_ENABLED: ${{ secrets.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_API_KEY_PATH != '' && secrets.APPLE_API_KEY != '' && secrets.APPLE_API_ISSUER != '' }}
      RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare-release.outputs.matrix) }}

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source }}

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libudev-dev \
            patchelf

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Apply release version in build workspace
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node scripts/release/desktop-release.mjs "$RELEASE_VERSION"
        shell: bash

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.platform }}-${{ matrix.rust-target }}

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download remote helper
        uses: actions/download-artifact@v8
        with:
          name: voktty-remote-linux-x86_64
          path: src-tauri/resources/remote/linux-x86_64

      - name: Download ARM64 remote helper
        uses: actions/download-artifact@v8
        with:
          name: voktty-remote-linux-aarch64
          path: src-tauri/resources/remote/linux-aarch64

      - name: Verify remote helper resources
        shell: bash
        run: |
          test -s src-tauri/resources/remote/linux-x86_64/voktty-remote
          test -s src-tauri/resources/remote/linux-aarch64/voktty-remote

      - name: Write Apple API key to disk
        if: startsWith(matrix.platform, 'macos') && env.APPLE_API_ENABLED == 'true'
        shell: bash
        env:
          KEY_CONTENT: ${{ secrets.APPLE_API_KEY_PATH }}
          KEY_ID: ${{ secrets.APPLE_API_KEY }}
          KEY_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$KEY_CONTENT" > "$HOME/private_keys/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY=$KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$KEY_ISSUER" >> "$GITHUB_ENV"

      - name: Configure Apple Signing Environment
        if: startsWith(matrix.platform, 'macos') && env.APPLE_SIGNING_ENABLED == 'true'
        shell: bash
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || matrix.apple-signing-identity }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "APPLE_CERTIFICATE=$CERT" >> "$GITHUB_ENV"
          echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS" >> "$GITHUB_ENV"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"

      - id: tauri
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VOKTTY_CLI_TARGET: ${{ matrix.rust-target }}
          NODE_OPTIONS: --max-old-space-size=4096
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_ENABLED == 'true' && secrets.APPLE_SIGNING_IDENTITY || matrix.apple-signing-identity }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare-release.outputs.release-id }}
          tagName: ${{ needs.prepare-release.outputs.tag }}
          releaseCommitish: ${{ needs.prepare-release.outputs.source }}
          releaseName: "Voktty ${{ needs.prepare-release.outputs.tag }}"
          releaseDraft: true
          prerelease: ${{ contains(needs.prepare-release.outputs.version, '-') }}
          args: ${{ matrix.args }}

      # Strip the bundled libwayland-* libs from the AppImage so it loads the
      # host copies at runtime. The Ubuntu 22.04 build host ships libwayland
      # 1.20, but recent Mesa (Fedora 43 / Arch / Bazzite, Mesa 1.22+) needs
      # newer symbols; AppImage puts its bundled libs first on the search path,
      # so the stale copy wins and EGL fails with EGL_BAD_PARAMETER. libgdk-3
      # hard-links these three, so removing them only redirects resolution to
      # the host copy, which every GTK-capable system has. They are on the
      # AppImage excludelist for this exact reason. The re-signed AppImage and
      # its .sig are re-uploaded here; the updater manifest is patched in the
      # patch-appimage-updater job after all matrix legs finish, so a parallel
      # macOS/Windows upload cannot clobber the combined latest.json.
      - name: Fix AppImage wayland libs and re-sign
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          APPIMAGE=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n1)
          BASENAME=$(basename "$APPIMAGE")
          echo "Patching: $APPIMAGE"

          WORK=$(mktemp -d)
          cp "$APPIMAGE" "$WORK/"
          pushd "$WORK" >/dev/null
          chmod +x "./$BASENAME"
          "./$BASENAME" --appimage-extract >/dev/null

          # Search for any bundled libwayland-* libraries anywhere in the AppDir.
          # Historically linuxdeploy bundled these on Ubuntu 22.04, causing EGL/Mesa
          # conflicts on modern distributions. Newer bundler versions exclude them upstream.
          FOUND_WAYLAND=$(find squashfs-root -name 'libwayland*.so*' 2>/dev/null || true)

          if [ -n "$FOUND_WAYLAND" ]; then
            echo "Found bundled wayland libraries; stripping from AppImage:"
            echo "$FOUND_WAYLAND"
            find squashfs-root -name 'libwayland*.so*' -delete

            curl -fsSL -o appimagetool.AppImage \
              https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
            chmod +x appimagetool.AppImage
            ARCH=x86_64 ./appimagetool.AppImage --appimage-extract-and-run squashfs-root "$BASENAME"

            # Sanity-check the repacked image before it replaces the original.
            rm -rf squashfs-root
            chmod +x "./$BASENAME"
            "./$BASENAME" --appimage-extract >/dev/null
            LEFTOVER=$(find squashfs-root -name 'libwayland*.so*' 2>/dev/null || true)
            if [ -n "$LEFTOVER" ]; then
              echo "libwayland still present after repack: $LEFTOVER"
              exit 1
            fi
            test -x squashfs-root/usr/bin/voktty \
              || { echo "voktty binary missing from repacked AppImage"; exit 1; }
            popd >/dev/null

            cp "$WORK/$BASENAME" "$APPIMAGE"

            rm -f "$APPIMAGE.sig"
            pnpm tauri signer sign "$APPIMAGE"

            TAG="$RELEASE_TAG"
            gh release upload "$TAG" "$APPIMAGE" "$APPIMAGE.sig" \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            echo "No bundled libwayland libraries found in AppImage (already excluded upstream)."
            test -x squashfs-root/usr/bin/voktty \
              || { echo "voktty binary missing from AppImage"; exit 1; }
            popd >/dev/null
          fi
          rm -rf "$WORK"

      # SignPath Authenticode-signs the Windows installers. Their bytes change,
      # so the minisign updater signatures tauri-action produced over the
      # unsigned files no longer match. We stage the installers under the exact
      # names the SignPath artifact configuration expects, submit them, then
      # re-run the tauri signer over the SIGNED files and re-upload both the
      # installers and their new .sig. latest.json is patched in the final
      # patch-updater-manifest job, after every matrix leg has merged, so a
      # parallel macOS/Linux upload cannot clobber the Windows signatures.
      - name: Stage Windows installers for SignPath
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bundleDir = "src-tauri/target/release/bundle"
          $exe = Get-ChildItem "$bundleDir/nsis" -Filter *.exe | Select-Object -First 1
          $msi = Get-ChildItem "$bundleDir/msi"  -Filter *.msi | Select-Object -First 1
          if (-not $exe) { throw "No NSIS .exe produced by Tauri" }
          if (-not $msi) { throw "No .msi produced by Tauri" }
          New-Item -ItemType Directory -Path signpath-staging -Force | Out-Null
          Copy-Item $exe.FullName signpath-staging/voktty-setup.exe
          Copy-Item $msi.FullName signpath-staging/voktty.msi
          "EXE_REAL_PATH=$($exe.FullName)" | Out-File $env:GITHUB_ENV -Append
          "MSI_REAL_PATH=$($msi.FullName)" | Out-File $env:GITHUB_ENV -Append

      - name: Upload unsigned Windows artifact
        id: upload-windows
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-unsigned
          path: signpath-staging/
          if-no-files-found: error

      # Requires manual approval in the SignPath UI for the production policy.
      # The default wait timeout is 600s; bumped so the job survives the time
      # it takes to review and approve the request during a release.
      - name: Submit Windows installers to SignPath
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: 'df665bf4-9b76-41ae-9596-1ba3a23010aa'
          project-slug: 'voktty'
          signing-policy-slug: 'release-signing'
          artifact-configuration-slug: 'initial'
          github-artifact-id: ${{ steps.upload-windows.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: 'signed'

      - name: Re-sign updater and upload signed Windows installers
        if: matrix.platform == 'windows-latest' && env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = "Stop"
          $signedExe = "signed/voktty-setup.exe"
          $signedMsi = "signed/voktty.msi"
          foreach ($f in @($signedExe, $signedMsi)) {
            if (-not (Test-Path $f)) { throw "Signed artifact missing: $f" }
            $sig = Get-AuthenticodeSignature $f
            if ($null -eq $sig.SignerCertificate) { throw "$f is NOT Authenticode-signed" }
            if ($sig.Status -ne 'Valid') { throw "$f signature status: $($sig.Status)" }
            Write-Host "OK $f -> $($sig.SignerCertificate.Subject)"
          }
          Copy-Item $signedExe $env:EXE_REAL_PATH -Force
          Copy-Item $signedMsi $env:MSI_REAL_PATH -Force
          Remove-Item "$($env:EXE_REAL_PATH).sig" -ErrorAction SilentlyContinue
          Remove-Item "$($env:MSI_REAL_PATH).sig" -ErrorAction SilentlyContinue
          pnpm tauri signer sign $env:EXE_REAL_PATH
          pnpm tauri signer sign $env:MSI_REAL_PATH
          gh release upload $env:RELEASE_TAG `
            $env:EXE_REAL_PATH "$($env:EXE_REAL_PATH).sig" `
            $env:MSI_REAL_PATH "$($env:MSI_REAL_PATH).sig" `
            --clobber --repo $env:GITHUB_REPOSITORY

  publish-host-packages:
    needs: [prepare-release, build-host-packages, publish-tauri]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: voktty-host-packages
          path: host-packages
      - name: Verify and publish host packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          set -euo pipefail
          cd host-packages
          sha256sum -c ./*.sha256
          test "$(find . -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)" -eq 6
          gh release upload "$RELEASE_TAG" ./*.tar.gz ./*.zip ./*.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"

  publish-android-apk:
    needs: prepare-release
    if: needs.prepare-release.outputs.android == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust_target: aarch64-linux-android
            tauri_target: aarch64
            ndk_prefix: aarch64-linux-android
            abi: arm64-v8a
            bootstrap_arch: aarch64
            apk_suffix: arm64
          - rust_target: x86_64-linux-android
            tauri_target: x86_64
            ndk_prefix: x86_64-linux-android
            abi: x86_64
            bootstrap_arch: x86_64
            apk_suffix: x64

    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source }}

      - name: Apply release version in build workspace
        env:
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
        run: node scripts/release/desktop-release.mjs "$RELEASE_VERSION"
        shell: bash

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358" || true
          NDK_DIR="$ANDROID_HOME/ndk/28.2.13676358"
          if [ ! -d "$NDK_DIR" ]; then
            LATEST_NDK=$(ls -1d $ANDROID_HOME/ndk/* 2>/dev/null | sort -V | tail -n 1)
            if [ -n "$LATEST_NDK" ]; then
              NDK_DIR="$LATEST_NDK"
            fi
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin"
          echo "$TOOLCHAIN" >> $GITHUB_PATH
          TARGET_ENV=$(echo "${{ matrix.rust_target }}" | tr '[:lower:]' '[:upper:]' | tr '-' '_')
          CLANG="$TOOLCHAIN/${{ matrix.ndk_prefix }}28-clang"
          echo "CC_${{ matrix.rust_target }}=$CLANG" >> $GITHUB_ENV
          echo "CC_${TARGET_ENV}=$CLANG" >> $GITHUB_ENV
          echo "CARGO_TARGET_${TARGET_ENV}_LINKER=$CLANG" >> $GITHUB_ENV
          echo "AR_${{ matrix.rust_target }}=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "AR_${TARGET_ENV}=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          echo "CARGO_TARGET_${TARGET_ENV}_AR=$TOOLCHAIN/llvm-ar" >> $GITHUB_ENV
          ln -sf "$CLANG" "$TOOLCHAIN/${{ matrix.rust_target }}-clang" || true
          ln -sf "$CLANG" "$TOOLCHAIN/${{ matrix.rust_target }}28-clang" || true
          ln -sf "$CLANG" "$TOOLCHAIN/${{ matrix.ndk_prefix }}-clang" || true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ matrix.rust_target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-${{ matrix.rust_target }}-

      - name: Install dependencies
        run: pnpm install
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"

      - name: Download bootstrap zip if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p src-tauri/bootstrap-zips
          mkdir -p src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}
          ZIP_FILE="src-tauri/bootstrap-zips/bootstrap-${{ matrix.bootstrap_arch }}.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Downloading bootstrap zip for ${{ matrix.bootstrap_arch }}..."
            gh release download bootstrap-v15 \
              --repo zico20047/terax-ai-android \
              --pattern "bootstrap-${{ matrix.bootstrap_arch }}.zip" \
              --dir src-tauri/bootstrap-zips \
              --clobber
          fi
          SIZE=$(stat -c%s "$ZIP_FILE")
          echo "Bootstrap zip size: $SIZE bytes"
          if [ "$SIZE" -lt 1000000 ]; then
            echo "ERROR: Bootstrap zip too small ($SIZE bytes)!"
            exit 1
          fi
          echo "OK: bootstrap zip verified ($SIZE bytes)"

      - name: Compile LD_PRELOAD library
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          $TOOLCHAIN/${{ matrix.ndk_prefix }}28-clang \
            -shared -fPIC -O2 \
            -o src-tauri/gen/android/app/src/main/jniLibs/${{ matrix.abi }}/libvoktty-path-translate.so \
            src-tauri/src/modules/path-translate/path-translate.c

      - name: Configure Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VOKTTY_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.VOKTTY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VOKTTY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VOKTTY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            KEYSTORE_PATH="src-tauri/gen/android/app/voktty-release.keystore"
            echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            printf "VOKTTY_STORE_PASSWORD=%s\nVOKTTY_KEY_ALIAS=%s\nVOKTTY_KEY_PASSWORD=%s\n" \
              "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > src-tauri/gen/android/local.properties
          fi

      - name: Build APK
        run: pnpm tauri android build --apk --target ${{ matrix.tauri_target }}

      - name: Rename APK
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal"
          APK=$(find "$APK_DIR" -name "*.apk" | head -1)
          if [ -z "$APK" ]; then
            APK_DIR="src-tauri/gen/android/app/build/outputs/apk"
            APK=$(find "$APK_DIR" -name "*.apk" | head -1)
          fi
          cp "$APK" \
            voktty-android-${{ needs.prepare-release.outputs.tag }}-${{ matrix.apk_suffix }}.apk

      - name: Upload APK to Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            "voktty-android-${RELEASE_TAG}-${{ matrix.apk_suffix }}.apk" \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voktty-android-${{ matrix.apk_suffix }}
          path: voktty-android-*.apk

  patch-updater-manifest:
    needs: [prepare-release, publish-tauri, publish-host-packages, publish-android-apk]
    if: |
      always() &&
      !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      needs.prepare-release.result == 'success' &&
      needs.publish-tauri.result == 'success' &&
      needs.publish-host-packages.result == 'success'
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare-release.outputs.source }}
      - name: Wait for the source commit's CI to pass
        if: github.event_name == 'workflow_dispatch'
        timeout-minutes: 150
        uses: actions/github-script@v9
        env:
          RELEASE_SOURCE: ${{ needs.prepare-release.outputs.source }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { ciGate } = await import(pathToFileURL(resolve('scripts/release/desktop-release.mjs')).href);
            const source = process.env.RELEASE_SOURCE;
            const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
            for (let check = 1; ; check++) {
              const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'ci.yml', head_sha: source, per_page: 20 });
              const gate = ciGate(data.workflow_runs || [], source);
              if (gate.state === 'passed') {
                core.info(`CI passed: ${gate.url}`);
                break;
              }
              if (gate.state === 'failed') {
                throw new Error(`CI for ${source} ended as ${gate.conclusion}: ${gate.url}. The release stays a draft. A newer push to main cancels this CI; release the newest commit instead.`);
              }
              if (gate.state === 'missing' && check > 15) {
                throw new Error(`No CI run on main for ${source}; the release stays a draft.`);
              }
              core.info(`CI for ${source} is ${gate.state}; checking again in 60s.`);
              await sleep(60000);
            }
      - name: Patch latest.json with re-signed AppImage and Windows signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ needs.prepare-release.outputs.tag }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_MATRIX: ${{ needs.prepare-release.outputs.matrix }}
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          DL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"

          # Download latest.json if available
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "latest.json" --clobber || true

          if [ ! -f "latest.json" ]; then
            echo "Missing updater manifest; keeping release in draft."
            exit 1
          fi

          # Download re-signed signatures if available
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*_amd64.AppImage.sig" --clobber || true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*_x64-setup.exe.sig" --clobber || true
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "*_x64_en-US.msi.sig" --clobber || true

          APP_SIG_FILE=$(ls ./*_amd64.AppImage.sig 2>/dev/null | head -n1 || true)
          EXE_SIG_FILE=$(ls ./*_x64-setup.exe.sig 2>/dev/null | head -n1 || true)
          MSI_SIG_FILE=$(ls ./*_x64_en-US.msi.sig 2>/dev/null | head -n1 || true)

          # Patch AppImage if re-signed
          if [ -n "$APP_SIG_FILE" ] && [ -f "$APP_SIG_FILE" ]; then
            APP_SIG=$(cat "$APP_SIG_FILE")
            APP_FILE=$(basename "$APP_SIG_FILE" .sig)
            APP_URL="$DL/$APP_FILE"
            jq --arg app "$APP_SIG" --arg appurl "$APP_URL" '
              if .platforms["linux-x86_64"] then .platforms["linux-x86_64"] += {signature: $app, url: $appurl} else . end
              | (if .platforms["linux-x86_64-appimage"]
                 then .platforms["linux-x86_64-appimage"] += {signature: $app, url: $appurl}
                 else . end)
            ' latest.json > latest.json.tmp && mv latest.json.tmp latest.json
          fi

          # Patch Windows NSIS / MSI if re-signed by SignPath
          if [ -n "$EXE_SIG_FILE" ] && [ -f "$EXE_SIG_FILE" ]; then
            EXE_SIG=$(cat "$EXE_SIG_FILE")
            EXE_FILE=$(basename "$EXE_SIG_FILE" .sig)
            EXE_URL="$DL/$EXE_FILE"
            jq --arg nsis "$EXE_SIG" --arg exeurl "$EXE_URL" '
              if .platforms["windows-x86_64-nsis"] then .platforms["windows-x86_64-nsis"] += {signature: $nsis, url: $exeurl} else . end
              | if .platforms["windows-x86_64"] then .platforms["windows-x86_64"] += {signature: $nsis, url: $exeurl} else . end
            ' latest.json > latest.json.tmp && mv latest.json.tmp latest.json
          fi

          if [ -n "$MSI_SIG_FILE" ] && [ -f "$MSI_SIG_FILE" ]; then
            MSI_SIG=$(cat "$MSI_SIG_FILE")
            MSI_FILE=$(basename "$MSI_SIG_FILE" .sig)
            MSI_URL="$DL/$MSI_FILE"
            jq --arg msi "$MSI_SIG" --arg msiurl "$MSI_URL" '
              if .platforms["windows-x86_64-msi"] then .platforms["windows-x86_64-msi"] += {signature: $msi, url: $msiurl} else . end
            ' latest.json > latest.json.tmp && mv latest.json.tmp latest.json
          fi

          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import { verifyUpdaterManifest } from './scripts/release/desktop-release.mjs';

          const tag = process.env.RELEASE_TAG;
          const repo = process.env.GITHUB_REPOSITORY;
          const dlBase = `https://github.com/${repo}/releases/download/${tag}`;

          const manifest = JSON.parse(readFileSync('latest.json', 'utf8'));

          try {
            const raw = execFileSync('gh', ['release', 'view', tag, '--repo', repo, '--json', 'assets'], { encoding: 'utf8' });
            const { assets } = JSON.parse(raw);
            if (manifest.platforms && Array.isArray(assets)) {
              for (const [key, entry] of Object.entries(manifest.platforms)) {
                if (entry && entry.url && entry.url.includes('api.github.com')) {
                  const match = assets.find(a =>
                    a.url === entry.url ||
                    a.apiUrl === entry.url ||
                    (a.id && entry.url.endsWith(`/${a.id}`))
                  );
                  if (match && match.name) {
                    entry.url = `${dlBase}/${match.name}`;
                  }
                }
              }
            }
            writeFileSync('latest.json', JSON.stringify(manifest, null, 2));
          } catch (error) {
            console.warn('Could not normalize release asset URLs:', error.message);
          }

          verifyUpdaterManifest(JSON.parse(readFileSync('latest.json', 'utf8')), {
            version: process.env.RELEASE_VERSION,
            tag: process.env.RELEASE_TAG,
            matrix: JSON.parse(process.env.RELEASE_MATRIX),
          }, process.env.GITHUB_REPOSITORY);
          NODE

          gh release upload "$TAG" latest.json --clobber --repo "$GITHUB_REPOSITORY"

      - name: Publish verified release
        uses: actions/github-script@v9
        env:
          RELEASE_LATEST: ${{ needs.prepare-release.outputs.latest }}
          RELEASE_VERSION: ${{ needs.prepare-release.outputs.version }}
          RELEASE_ID: ${{ needs.prepare-release.outputs.release-id }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { resolve } = require('node:path');
            const { compareVersions } = await import(pathToFileURL(resolve('scripts/release/desktop-release.mjs')).href);
            let latest = process.env.RELEASE_LATEST === 'true';
            if (latest) {
              const published = await github.rest.repos.getLatestRelease(context.repo).catch((error) => {
                if (error.status !== 404) throw error;
                return null;
              });
              const current = published?.data.tag_name.match(/^v(\d+\.\d+\.\d+)$/)?.[1];
              if (current && compareVersions(process.env.RELEASE_VERSION, current) <= 0) latest = false;
            }
            await github.rest.repos.updateRelease({ ...context.repo, release_id: Number(process.env.RELEASE_ID), draft: false, make_latest: latest ? 'true' : 'false' });
