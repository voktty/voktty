version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    # These move as a set and are pinned by hand (see overrides in
    # pnpm-workspace.yaml). A grouped bump of only some of them broke the diff
    # editor, so update them together, deliberately.
    ignore:
      - dependency-name: "@codemirror/*"
      - dependency-name: "@lezer/*"
      - dependency-name: "@uiw/*"
      - dependency-name: "codemirror-languageserver"
      - dependency-name: "remend"
      - dependency-name: "streamdown"
      - dependency-name: "rolldown"
    groups:
      npm-dev:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: "/src-tauri"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 3
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
