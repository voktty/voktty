<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Gradiente de fondo suave -->
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#06080E"/>
    </linearGradient>
    
    <!-- Resplandor sutil para el acento -->
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo base -->
  <rect width="1200" height="400" fill="url(#bg-gradient)"/>

  <!-- Línea decorativa sutil estilo terminal -->
  <line x1="0" y1="399" x2="1200" y2="399" stroke="#1E293B" stroke-width="1"/>

  <!-- GRUPO ISOTIPO (X: 140, Y: 100) -->
  <g transform="translate(140, 100)">
    <!-- Glow del isotipo -->
    <circle cx="100" cy="100" r="60" fill="#6366F1" opacity="0.15" filter="url(#subtle-glow)"/>
    
    <!-- Brazo izquierdo V (Chevron blanco) -->
    <path d="M40 50 L100 150" stroke="#F8FAFC" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Brazo derecho V (Violeta eléctrico) -->
    <path d="M100 150 L160 50" stroke="#6366F1" stroke-width="24" stroke-linecap="round"/>
    
    <!-- Cursor Prompt (Verde terminal) -->
    <line x1="120" y1="160" x2="155" y2="160" stroke="#10B981" stroke-width="20" stroke-linecap="round"/>
  </g>

  <!-- GRUPO TIPOGRAFÍA Y TAGLINE (X: 380, Y: 130) -->
  <g transform="translate(380, 130)">
    <!-- Nombre de marca -->
    <text x="0" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="82" font-weight="800" letter-spacing="-2" fill="#F8FAFC">
      voktty<tspan fill="#6366F1">.</tspan>
    </text>

    <!-- Tagline principal -->
    <text x="5" y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="22" font-weight="500" fill="#94A3B8" letter-spacing="0.5">
      The AI-native terminal workspace with native MCP client
    </text>

    <!-- Pill Badge técnico -->
    <g transform="translate(5, 145)">
      <rect width="210" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <circle cx="18" cy="17" r="5" fill="#10B981"/>
      <text x="32" y="23" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="13" font-weight="600" fill="#E2E8F0">
        TAURI 2 + RUST CORE
      </text>
    </g>
  </g>
</svg>
